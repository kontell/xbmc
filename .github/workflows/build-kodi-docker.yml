name: Build Kodi
on:
  push:
    branches: ['ci/build']
  workflow_dispatch:

jobs:
  build:
    name: Kodi 21 (Debian trixie, x86_64, patched)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
    # Runner's / has ~14 GB free; our in-container build (~20 GB tmp)
    # won't fit. Free the partition first, then point Docker's data-root
    # at the freed mount via daemon.json.
    - name: Free build space on /mnt
      uses: easimon/maximize-build-space@v10
      with:
        # Leave enough on / for git checkout + /tmp/apt-caches-inside-container.
        # First few runs had ~100 MB free after the action ran and step 4
        # (checkout) occasionally failed silently; 4 GB reserve is plenty.
        root-reserve-mb: 4096
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'
        build-mount-path: /mnt/build

    - name: Move Docker data-root to /mnt/build/docker
      run: |
        sudo systemctl stop docker docker.socket containerd || true
        sudo rm -rf /var/lib/docker
        sudo mkdir -p /mnt/build/docker /etc/docker
        echo '{"data-root": "/mnt/build/docker"}' | sudo tee /etc/docker/daemon.json
        sudo systemctl start docker
        docker info | grep -E 'Docker Root Dir|Storage Driver'
        df -h /mnt/build

    - name: Checkout patched Kodi
      uses: actions/checkout@v5
      with:
        path: kodi
        fetch-depth: 1

    # Kodi 21 includes <EGL/eglextchromium.h>. Mesa dropped that header and
    # no Debian package ships it. Write a minimal stub (enough for the
    # EGL_CHROMIUM_sync_control symbols Kodi references) on the runner and
    # copy it into /usr/local/include inside the container.
    - name: Write eglextchromium.h stub
      run: |
        cat > eglextchromium.h << 'EOF'
        #ifndef __eglextchromium_h_
        #define __eglextchromium_h_ 1

        #ifdef __cplusplus
        extern "C" {
        #endif

        #ifndef EGL_CHROMIUM_sync_control
        #define EGL_CHROMIUM_sync_control 1
        typedef EGLBoolean (EGLAPIENTRYP PFNEGLGETSYNCVALUESCHROMIUMPROC)(EGLDisplay dpy, EGLSurface surface, EGLuint64KHR *ust, EGLuint64KHR *msc, EGLuint64KHR *sbc);
        #ifdef EGL_EGLEXT_PROTOTYPES
        EGLAPI EGLBoolean EGLAPIENTRY eglGetSyncValuesCHROMIUM(EGLDisplay dpy, EGLSurface surface, EGLuint64KHR *ust, EGLuint64KHR *msc, EGLuint64KHR *sbc);
        #endif
        #endif /* EGL_CHROMIUM_sync_control */

        #ifdef __cplusplus
        }
        #endif

        #endif /* __eglextchromium_h_ */
        EOF

    # Build inside debian:trixie so the resulting binary links against the
    # same glibc / system libs as the P1D target (Debian forky ≈ trixie-next).
    # We use -DENABLE_INTERNAL_FFMPEG=ON to bundle Kodi's own FFmpeg 6,
    # sidestepping Debian's FFmpeg 7 API-break dance entirely.
    - name: Build Kodi inside Debian container
      run: |
        # Kodi's RelWithDebInfo objects + debug info easily exceed 10 GB.
        # Host / has only ~4 GB free after maximize-build-space; put the
        # build tree on the 100 GB /mnt/build volume.
        sudo mkdir -p /mnt/build/kodi-build
        sudo chown $(id -u):$(id -g) /mnt/build/kodi-build

        docker run --rm \
          --volume "$GITHUB_WORKSPACE:/work:ro" \
          --volume "/mnt/build/kodi-build:/build" \
          --workdir /build \
          --env DEBIAN_FRONTEND=noninteractive \
          debian:trixie \
          bash -exc '
            apt-get update
            apt-get install -y --no-install-recommends \
              ca-certificates git curl wget \
              build-essential cmake ninja-build nasm meson \
              autoconf automake autopoint autotools-dev libtool \
              gawk gperf swig unzip zip default-jre-headless python3-dev python3-pil python3-pip \
              pkgconf gettext hwdata lsb-release \
              libasound2-dev libass-dev libavahi-client-dev libavahi-common-dev \
              libbluetooth-dev libbluray-dev libbz2-dev libcap-dev libcdio-dev \
              libcurl4-openssl-dev libdbus-1-dev libdrm-dev \
              libegl-dev libenca-dev libexiv2-dev libflac-dev libflatbuffers-dev mesa-common-dev \
              libfmt-dev libfontconfig-dev libfreetype-dev libfribidi-dev \
              libfstrcmp-dev libgbm-dev libgcrypt-dev libgif-dev libgl-dev \
              libgles-dev libglu1-mesa-dev libglew-dev libgnutls28-dev libgpg-error-dev \
              libgtest-dev libinput-dev libiso9660-dev libjpeg-dev liblcms2-dev \
              libltdl-dev liblzo2-dev libmariadb-dev libmicrohttpd-dev libnfs-dev \
              libogg-dev libp8-platform-dev libpcre2-dev libplist-dev libpng-dev \
              libpulse-dev libshairplay-dev libsmbclient-dev libsndio-dev \
              libspdlog-dev libsqlite3-dev libssl-dev libtag1-dev libtiff-dev \
              libtinyxml-dev libtinyxml2-dev libudev-dev libunistring-dev \
              libva-dev libvdpau-dev libvorbis-dev libwayland-dev libxkbcommon-dev \
              waylandpp-dev wayland-protocols libxmu-dev libxrandr-dev libxslt1-dev \
              libxt-dev nlohmann-json3-dev rapidjson-dev uuid-dev zlib1g-dev

            # git refuses to cooperate with a repo owned by another uid
            git config --global --add safe.directory "*"

            # eglextchromium.h stub was pre-written on the runner; copy in.
            mkdir -p /usr/local/include/EGL
            cp /work/eglextchromium.h /usr/local/include/EGL/eglextchromium.h

            # libdisplay-info 0.3.0 (matches upstream kodi-docker-build)
            mkdir -p /tmp/deps && cd /tmp/deps
            git clone https://gitlab.freedesktop.org/emersion/libdisplay-info
            cd libdisplay-info
            git checkout 0.3.0
            mkdir build && cd build
            meson setup --prefix=/usr/local --buildtype=release
            ninja
            ninja install

            # PCRE1 (libpcre3-dev) was removed from Debian trixie — package is
            # EOL. Kodi 21s CMake still expects PCRE1. Build from source.
            cd /tmp/deps
            curl -LO https://sourceforge.net/projects/pcre/files/pcre/8.45/pcre-8.45.tar.gz/download
            mv download pcre-8.45.tar.gz
            tar xf pcre-8.45.tar.gz
            cd pcre-8.45
            ./configure --prefix=/usr/local --enable-utf --enable-unicode-properties \
              --disable-static --enable-shared
            make -j$(nproc)
            make install
            ldconfig

            # Sources at /work (read-only), build tree at /build (on the
            # maximized /mnt/build volume). The final link line unconditionally
            # references build/lib/libcrossguid-dgb.a, so we need the internal
            # crossguid build — enable with ENABLE_INTERNAL_CROSSGUID=ON.
            cd /build
            # Install prefix matches where the tarball will be extracted
            # on the target (/opt/kodi-patched). Kodi bakes this path into
            # both the launcher script (LIBDIR/@libdir@) and the compiled
            # binary (-DBIN_INSTALL_PATH, -DINSTALL_PATH), so a mismatch
            # between build-time prefix and runtime location breaks
            # everything.
            cmake /work/kodi \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/opt/kodi-patched \
              -DCMAKE_GENERATOR=Ninja \
              -DCORE_PLATFORM_NAME=x11 \
              -DADDONS_CONFIGURE_AT_STARTUP=0 \
              -DENABLE_INTERNAL_DAV1D=ON \
              -DENABLE_INTERNAL_CROSSGUID=ON \
              -DAPP_RENDER_SYSTEM=gl \
              -DENABLE_INTERNAL_FFMPEG=ON
            cmake --build .
            # Stage into DESTDIR so we can tar the tree without needing
            # /opt/kodi-patched to exist on the runner. Files land at
            # /build/stage/opt/kodi-patched/{bin,lib,share,...}.
            DESTDIR=/build/stage cmake --build . -- install
          '

    - name: Show install tree
      if: always()
      run: |
        ls -la /mnt/build/kodi-build/stage/opt/kodi-patched/ 2>/dev/null || true
        ls -la /mnt/build/kodi-build/stage/opt/kodi-patched/bin/ 2>/dev/null || true
        sudo du -sh /mnt/build/kodi-build/stage/opt/kodi-patched 2>/dev/null || true

    - name: Package install tree
      run: |
        # Staged tree at /build/stage/opt/kodi-patched/ inside container →
        # /mnt/build/kodi-build/stage/opt/kodi-patched/ on host, owned by root.
        sudo chown -R $(id -u):$(id -g) /mnt/build/kodi-build/stage
        cd /mnt/build/kodi-build/stage/opt
        # Archive preserves /opt/kodi-patched/... — extract with
        #   sudo tar xzf THIS.tar.gz -C /
        # and it lands at /opt/kodi-patched.
        tar czf /tmp/kodi-debian-trixie-x86_64-kodi21.tar.gz kodi-patched
        ls -lah /tmp/kodi-debian-trixie-x86_64-kodi21.tar.gz

    - name: Upload Kodi build
      uses: actions/upload-artifact@v4
      with:
        name: kodi-debian-trixie-x86_64-kodi21
        path: /tmp/kodi-debian-trixie-x86_64-kodi21.tar.gz
        if-no-files-found: error
