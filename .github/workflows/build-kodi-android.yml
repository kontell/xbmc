name: Build Kodi (Android)
on:
  push:
    branches: ['ci/build-piers']
  workflow_dispatch:

jobs:
  build:
    name: Kodi 22 (Android arm, patched)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      # Kodi 22 (Piers) requires C++20 including <ranges> and constexpr
      # std::string from the STANDARD LIBRARY, not just the compiler.
      # r25c clang 14's libc++ is too old (std::ranges missing, basic_string
      # isn't constexpr). r27 ships clang 18 + libc++ 18 which has full
      # C++20 library support. Docs/README.Android.md lists r21 — stale.
      NDK_VERSION: 27.0.12077973
      SDK_CMDLINE_TOOLS: commandlinetools-linux-11076708_latest.zip
      ANDROID_ROOT: /mnt/build/android
      KODI_DEPENDS_PREFIX: /mnt/build/xbmc-depends
      KODI_TARBALLS: /mnt/build/xbmc-tarballs
      KODI_BUILD: /mnt/build/kodi-build
      # Keep caches off the tiny root partition. Root only has ~100 MB free
      # after maximize-build-space; default ccache (~/.ccache) and gradle
      # (~/.gradle) will fill it during the Kodi compile + APK package and
      # crash the runner with ENOSPC.
      CCACHE_DIR: /mnt/build/ccache
      GRADLE_USER_HOME: /mnt/build/gradle
      TMPDIR: /mnt/build/tmp
    steps:
    - name: Free build space on /mnt
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 4096
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'
        build-mount-path: /mnt/build

    # / has only ~100 MB free after maximize-build-space (the action's
    # root-reserve-mb doesn't actually guarantee that amount). Check out
    # onto the large /mnt/build volume instead, and relocate caches that
    # would otherwise sit on root.
    - name: Prepare checkout target + caches on /mnt
      run: |
        sudo mkdir -p /mnt/build/kodi /mnt/build/ccache /mnt/build/gradle /mnt/build/tmp
        sudo chown -R $(id -u):$(id -g) /mnt/build/kodi /mnt/build/ccache /mnt/build/gradle /mnt/build/tmp
        ln -s /mnt/build/kodi $GITHUB_WORKSPACE/kodi

    - name: Checkout patched Kodi (ci/build-piers)
      uses: actions/checkout@v5
      with:
        path: kodi
        fetch-depth: 1

    - name: Install host build tools
      run: |
        sudo apt-get update
        # Match docs/README.Android.md §2 (plus the non-docs-listed bits the
        # tools/depends native bootstrap needs: autoconf/automake/libtool,
        # meson, ninja, nasm, swig, pkgconf, python3).
        sudo apt-get install -y --no-install-recommends \
          autoconf automake autopoint autotools-dev libtool \
          bison flex \
          build-essential ccache cmake ninja-build nasm meson \
          curl wget git ca-certificates unzip zip \
          default-jdk-headless ant \
          gawk gperf gettext pkgconf python3 python3-pip swig \
          libcurl4-openssl-dev zlib1g-dev \
          lib32stdc++6 lib32z1

    - name: Install Android SDK (cmdline-tools + platform + ndk)
      run: |
        sudo mkdir -p $ANDROID_ROOT
        sudo chown $(id -u):$(id -g) $ANDROID_ROOT
        cd $ANDROID_ROOT
        curl -fsSLO https://dl.google.com/android/repository/$SDK_CMDLINE_TOOLS
        unzip -q $SDK_CMDLINE_TOOLS
        rm $SDK_CMDLINE_TOOLS
        # sdkmanager needs cmdline-tools/latest/ layout
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/NOTICE.txt cmdline-tools/source.properties cmdline-tools/latest/
        yes | cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_ROOT --licenses >/dev/null
        cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_ROOT \
          "platform-tools" \
          "platforms;android-34" \
          "build-tools;33.0.1" \
          "ndk;$NDK_VERSION"

    - name: Symlink JDK include/android → include/linux (libbluray meson)
      run: |
        # libbluray's meson.build looks for JNI headers under
        # $JAVA_HOME/include/$host_system. When cross-compiling for Android
        # host_system='android', but a host JDK only ships include/linux.
        # The headers are identical for our purposes; symlink it.
        JAVA_INC=$JAVA_HOME/include
        [ -d "$JAVA_INC/android" ] || sudo ln -s linux "$JAVA_INC/android"

    - name: Generate debug keystore (APK signing)
      run: |
        mkdir -p $HOME/.android
        keytool -genkey -keystore $HOME/.android/debug.keystore \
          -alias androiddebugkey \
          -dname "CN=Android Debug,O=Android,C=US" \
          -keypass android -storepass android \
          -keyalg RSA -keysize 2048 -validity 10000

    - name: Bootstrap + configure tools/depends (arm-linux-androideabi)
      run: |
        cd kodi/tools/depends
        ./bootstrap
        mkdir -p $KODI_TARBALLS $KODI_DEPENDS_PREFIX
        ./configure \
          --host=arm-linux-androideabi \
          --with-tarballs=$KODI_TARBALLS \
          --with-sdk-path=$ANDROID_ROOT \
          --with-ndk-path=$ANDROID_ROOT/ndk/$NDK_VERSION \
          --prefix=$KODI_DEPENDS_PREFIX

    - name: Build tools/depends (deps cross-compiled from source)
      run: |
        cd kodi/tools/depends
        make -j$(getconf _NPROCESSORS_ONLN)

    - name: Configure Kodi CMake build
      run: |
        mkdir -p $KODI_BUILD
        # ENABLE_BLURAY_JAR defaults to ON in CMakeLists.txt. The BD-J jars
        # need an Ant-compatible JDK (1.7 target) which modern JDKs can't
        # produce. Irrelevant for an Android audiobook app anyway.
        make -C kodi/tools/depends/target/cmakebuildsys BUILD_DIR=$KODI_BUILD \
          CMAKE_EXTRA_ARGUMENTS="-DENABLE_BLURAY_JAR=OFF"

    - name: Build Kodi
      run: |
        cd $KODI_BUILD
        make -j$(getconf _NPROCESSORS_ONLN)

    - name: Package APK
      run: |
        cd $KODI_BUILD
        make apk

    - name: Locate APK
      if: always()
      id: apk
      run: |
        # Gradle's assembleDebug lands at
        # $KODI_BUILD/xbmc/build/outputs/apk/debug/*.apk (5+ levels deep),
        # plus Kodi's `make apk` may also stage a copy elsewhere in the
        # source tree. Search without maxdepth and prefer unsigned/debug
        # outputs.
        echo "--- all .apk files found ---"
        find /mnt/build/kodi /mnt/build/kodi-build -name '*.apk' -print 2>/dev/null || true
        APK=$(find /mnt/build/kodi-build -name '*.apk' -type f 2>/dev/null | head -1)
        if [ -z "$APK" ]; then
          APK=$(find /mnt/build/kodi -name '*.apk' -type f 2>/dev/null | head -1)
        fi
        echo "Selected APK: $APK"
        echo "apk=$APK" >> $GITHUB_OUTPUT

    - name: Upload APK
      if: steps.apk.outputs.apk != ''
      uses: actions/upload-artifact@v4
      with:
        name: kodi-android-armeabi-v7a-kodi22
        path: ${{ steps.apk.outputs.apk }}
        if-no-files-found: error
